<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a02c26">
<title>单选题刷题 · 习概复习助手</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand-mark">习</div>
    <div class="brand-text"><b>单选题刷题</b><small>《习概》题库 · 17 讲 90 题</small></div>
    <div class="spacer"></div>
    <a class="link-home" href="index.html">首页</a>
  </div>
</header>

<main class="shell">

  <!-- 筛选设置 -->
  <div class="card tight">
    <div class="btn-row" style="align-items:flex-end">
      <div style="flex:1 1 100%; min-width:0">
        <label class="field-label" for="chapterSel">按讲筛选</label>
        <select class="sel" id="chapterSel" style="width:100%"></select>
      </div>
    </div>
    <div class="section-title" style="margin:14px 2px 8px">练习范围</div>
    <div class="chip-row" id="modeRow">
      <button class="chip on" data-mode="all">全部题目</button>
      <button class="chip" data-mode="undone">只做未做</button>
      <button class="chip" data-mode="wrong">只做错题</button>
    </div>
    <div class="chip-row" style="margin-top:10px">
      <button class="chip" id="shuffleChip">🔀 随机顺序：关</button>
    </div>
    <div class="tiny" style="margin-top:10px">切换范围会从第 1 题重新开始；作答记录会一直保留。</div>
  </div>

  <!-- 进度 -->
  <div class="card tight">
    <div class="progress-wrap">
      <div class="progress"><i id="progressBar" style="width:0%"></i></div>
      <div class="progress-num" id="progressText">—</div>
    </div>
    <div class="stats">
      <div class="stat"><b id="statDone">0</b><span>已答 / 90</span></div>
      <div class="stat ok"><b id="statOk">0</b><span>答对</span></div>
      <div class="stat no"><b id="statWrong">0</b><span>答错</span></div>
    </div>
  </div>

  <!-- 题目卡片 -->
  <div class="card" id="questionCard">
    <div id="qBody"></div>
  </div>

  <!-- 底部小工具 -->
  <div class="btn-row" style="margin-top:12px">
    <button class="btn btn-ghost btn-sm" id="prevBtn">← 上一题</button>
    <button class="btn btn-ghost btn-sm" id="jumpBtn">跳到未做</button>
    <button class="btn btn-ghost btn-sm" id="clearBtn">清空记录</button>
  </div>

  <!-- 已答记录 -->
  <div class="section-title">作答记录（点一条可回看）</div>
  <div class="card tight">
    <div id="historyList"></div>
  </div>

  <div class="footer">
    提交后即在题目下方显示正确答案 · 记录保存在本机浏览器<br>
    <a href="index.html">返回首页</a> · <a href="recite.html">去背书默写 →</a>
  </div>
</main>

<script src="assets/data.js"></script>
<script src="assets/quiz.js"></script>
</body>
</html>
